events {}

http {
    upstream fastapi_pool {
        # Uncomment to compare behavior:
        # least_conn;

        server api1:8000;
        server api2:8000;
        server api3:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://fastapi_pool;
            proxy_connect_timeout 1s;
            proxy_read_timeout 15s;
        }
    }
}
